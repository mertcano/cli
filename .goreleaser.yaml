version: 2

project_name: qfex

before:
  hooks:
    - go mod tidy
    - mkdir -p completions
    - sh -c "go run . completion bash > completions/qfex.bash"
    - sh -c "go run . completion zsh > completions/qfex.zsh"
    - sh -c "go run . completion fish > completions/qfex.fish"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    binary: qfex
    ldflags:
      - -s -w -X github.com/QFEX-org/cli/internal/build.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: packages
    package_name: qfex
    vendor: QFEX
    homepage: "https://github.com/QFEX-org/cli"
    maintainer: "QFEX <support@qfex.com>"
    description: "CLI for the QFEX perpetual futures exchange"
    license: "MIT"
    section: utils
    formats:
      - deb
    contents:
      - src: ./completions/qfex.bash
        dst: /usr/share/bash-completion/completions/qfex
        file_info:
          mode: 0644
      - src: ./completions/qfex.zsh
        dst: /usr/share/zsh/vendor-completions/_qfex
        file_info:
          mode: 0644
      - src: ./completions/qfex.fish
        dst: /usr/share/fish/vendor_completions.d/qfex.fish
        file_info:
          mode: 0644
      - src: ./README.md
        dst: /usr/share/doc/qfex/README.md
        file_info:
          mode: 0644

brews:
  - name: qfex
    repository:
      owner: QFEX-org
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "feat: update qfex to {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/QFEX-org/cli"
    description: "CLI for the QFEX perpetual futures exchange"
    license: "MIT"
    install: |
      bin.install "qfex"
    test: |
      assert_match version.to_s, shell_output("#{bin}/qfex version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
